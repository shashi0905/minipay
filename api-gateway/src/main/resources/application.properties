spring.application.name=api-gateway
server.port=8080

# Gateway Configuration
spring.cloud.gateway.default-filters=
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedOrigins=*
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedHeaders=*

# JWT Configuration (same as Payment Service)
jwt.secret=your-secret-key-change-this-in-production-use-strong-random-string-at-least-32-characters
jwt.expiration=86400000

# Rate Limiting Configuration
ratelimit.default.requests-per-minute=100
ratelimit.auth.login.requests-per-minute=5
ratelimit.auth.register.requests-per-minute=10
ratelimit.payments.requests-per-minute=10
ratelimit.orders.requests-per-minute=20

# Logging
logging.level.org.springframework.cloud.gateway=INFO
logging.level.com.shashi.minipay.gateway=DEBUG
