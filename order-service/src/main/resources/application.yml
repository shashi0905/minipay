spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://localhost:5432/minipay_order
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        default_schema: orders
        format_sql: true

server:
  port: 8083
  servlet:
    context-path: /

# JWT Configuration
jwt:
  secret: your-secret-key-change-this-in-production-use-strong-random-string-at-least-32-characters
  expiration: 86400000
  token:
    prefix: Bearer
