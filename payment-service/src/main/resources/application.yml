spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:postgresql://localhost:5432/minipay_payment
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        default_schema: payment
        format_sql: true

server:
  port: 8081
  servlet:
    context-path: /

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

# JWT Configuration
jwt:
  secret: your-secret-key-change-this-in-production-use-strong-random-string-at-least-32-characters
  expiration: 86400000
  token:
    prefix: Bearer
