spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
  h2:
    console:
      enabled: true

server:
  port: 8081
  servlet:
    context-path: /

# JWT Configuration
jwt:
  secret: your-secret-key-change-this-in-production-use-strong-random-string-at-least-32-characters
  expiration: 86400000
  token:
    prefix: Bearer
