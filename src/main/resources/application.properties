spring.application.name=payment-service

spring.datasource.url=jdbc:postgresql://localhost:5432/paymentdb
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT Configuration
# Secret key for signing tokens (use strong random string in production)
jwt.secret=your-secret-key-change-this-in-production-use-strong-random-string-at-least-32-characters
# Token expiration time in milliseconds (24 hours)
jwt.expiration=86400000
# Token prefix used in Authorization header
jwt.token.prefix=Bearer
